<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATLAS Estimating">
  <meta name="format-detection" content="telephone=no">
  <title>ATLAS Estimating — iPad</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./atlas-ipad-192.png">
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --vh: 1vh;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    #atlasFrame {
      position: fixed;
      top: var(--safe-top);
      right: var(--safe-right);
      bottom: var(--safe-bottom);
      left: var(--safe-left);
      width: calc(100% - var(--safe-left) - var(--safe-right));
      height: calc((var(--vh) * 100) - var(--safe-top) - var(--safe-bottom));
      border: 0;
      background: #0b0f14;
    }
    #installBtn {
      position: fixed;
      z-index: 20;
      top: calc(var(--safe-top) + 6px);
      right: calc(var(--safe-right) + 7px);
      min-height: 28px;
      padding: 4px 8px;
      border: 1px solid #435064;
      border-radius: 7px;
      background: rgba(16, 21, 29, .92);
      color: #e8edf4;
      font: 700 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 3px 12px rgba(0,0,0,.28);
      -webkit-tap-highlight-color: transparent;
    }
    #installBtn[hidden] { display: none; }
    #installHelp {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(var(--safe-top) + 16px) calc(var(--safe-right) + 16px)
               calc(var(--safe-bottom) + 16px) calc(var(--safe-left) + 16px);
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(5px);
    }
    #installHelp[hidden] { display: none; }
    .install-card {
      width: min(440px, 100%);
      border: 1px solid #394556;
      border-radius: 14px;
      background: #141a22;
      color: #e9eef5;
      padding: 16px;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 20px 55px rgba(0,0,0,.5);
    }
    .install-card h2 { margin: 0 0 8px; font-size: 18px; }
    .install-card p { margin: 7px 0; color: #bac4d0; }
    .install-card ol { margin: 10px 0 14px; padding-left: 22px; }
    .install-card button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #4b5a70;
      border-radius: 9px;
      background: #202a37;
      color: #fff;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <iframe
    id="atlasFrame"
    src="./index.html"
    title="ATLAS Estimating"
    allow="fullscreen"
  ></iframe>

  <button id="installBtn" type="button">iPad Install</button>

  <div id="installHelp" hidden>
    <div class="install-card">
      <h2>Install ATLAS on iPad</h2>
      <p>Open this page in Safari, then:</p>
      <ol>
        <li>Tap the <strong>Share</strong> button.</li>
        <li>Choose <strong>Add to Home Screen</strong>.</li>
        <li>Open <strong>ATLAS Estimating</strong> from the Home Screen.</li>
      </ol>
      <p>After one successful online launch, ATLAS caches the core app files so it can reopen without a connection.</p>
      <button id="closeInstallHelp" type="button">Close</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const root = document.documentElement;
      const frame = document.getElementById("atlasFrame");
      const installBtn = document.getElementById("installBtn");
      const installHelp = document.getElementById("installHelp");
      const closeInstallHelp = document.getElementById("closeInstallHelp");

      function setViewportHeight() {
        const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        root.style.setProperty("--vh", `${h * 0.01}px`);
      }

      function standalone() {
        return window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
      }

      setViewportHeight();
      window.addEventListener("resize", setViewportHeight, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(setViewportHeight, 80), { passive: true });
      window.visualViewport?.addEventListener("resize", setViewportHeight, { passive: true });
      window.visualViewport?.addEventListener("scroll", setViewportHeight, { passive: true });

      if (standalone()) {
        installBtn.hidden = true;
      } else {
        installBtn.hidden = false;
      }

      installBtn.addEventListener("click", () => {
        installHelp.hidden = false;
      });

      closeInstallHelp.addEventListener("click", () => {
        installHelp.hidden = true;
      });

      installHelp.addEventListener("click", (event) => {
        if (event.target === installHelp) installHelp.hidden = true;
      });

      // Safari can restore a page from memory with stale viewport values.
      window.addEventListener("pageshow", () => {
        setViewportHeight();
        try { frame.contentWindow?.dispatchEvent(new Event("resize")); } catch (_) {}
      });

      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw-ipad.js", { scope: "./" })
            .catch(err => console.warn("ATLAS iPad offline cache unavailable:", err));
        });
      }
    })();
  </script>
</body>
</html>
